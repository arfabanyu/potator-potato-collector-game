<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Cleaner</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="start-menu">
      <img src="public/images/banyu_game_logo.png" alt="Game Cleaner" />
      <div class="container">
        <span id="best-score">Best score: 0</span>
        <span id="longest-time">Longest time: 0s</span>
        <button>Play</button>
      </div>
    </div>
    <div class="in-game">
      <div class="top-bar">
        <p id="time"></p>
        <p id="score"></p>
      </div>
      <canvas height="450" width="500"></canvas>
      <div class="paused-menu">
        <button id="pause">Pause</button>
        <button id="resume">Continue</button>
        <button id="reset">Reset</button>
        <button id="exit">Exit</button>
      </div>
      <div class="notification">
        <div class="container">
          <h2></h2>
          <p id="time"></p>
          <p id="score"></p>
          <button id="exit">Exit</button>
        </div>
      </div>
      <div class="menu-condition">
        <p></p>
      </div>
    </div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
